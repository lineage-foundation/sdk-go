name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: go test
        run: go test ./...

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  integration:
    runs-on: ubuntu-latest
    # Wire-compat check against a live node (`/v1/transactions:serialize` +
    # `:deserialize`). Only runs when LINEAGE_TEST_HOST is configured as a
    # repo/environment secret; the job (and the unit-test/vet/lint job above)
    # otherwise no-ops rather than failing the pipeline, so forks and PRs
    # without the secret aren't blocked.
    if: ${{ secrets.LINEAGE_TEST_HOST != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: go test -tags=integration
        env:
          LINEAGE_TEST_HOST: ${{ secrets.LINEAGE_TEST_HOST }}
        run: go test -tags=integration ./...
